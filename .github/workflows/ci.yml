name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]  # macOS arm64, Linux x86_64
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: CPU GL on Linux (the runner has no GPU or libEGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libosmesa6
          echo MUJOCO_GL=osmesa >> "$GITHUB_ENV"
      - run: uv run --locked --all-extras --python ${{ matrix.python }} pytest --ignore=tests/test_data.py
      - name: Record and replay an episode of every task (spec §17 determinism)
        run: uv run --locked --all-extras --python ${{ matrix.python }} pytest tests/test_data.py
