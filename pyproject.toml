[project]
name = "hamsterball"
version = "0.0.0"
description = "A hamster running inside a rolling shell: a Gymnasium env and a human-playable game on one MuJoCo core."
requires-python = ">=3.11"
dependencies = [
    "mujoco==3.16.0",
    "gymnasium>=1.4,<2",
    "numpy",
    "pyyaml>=6.0.3",
    "click>=8.1",
]

[project.optional-dependencies]
# Minari 0.5's DataCollector imports jax, which only its `create` extra installs.
data = [
    "av",
    "minari[arrow,create]==0.5.*",
    "pillow",
]
# the game records every finished episode (spec §13), so it needs the data extra
game = ["hamsterball[data]", "imgui-bundle", "glfw"]
all = ["hamsterball[data,game]"]
lerobot = [
    "lerobot[dataset]>=0.6 ; python_full_version >= '3.12' and python_full_version < '3.14'",
]

[project.scripts]
hamsterball-play = "hamsterball.game.window:main"
hamsterball-bench = "hamsterball.bench:main"
hamsterball-baseline = "hamsterball.baseline:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
