[project]
name = "hamsterball"
version = "0.0.0"
description = "A hamster running inside a rolling shell: a Gymnasium env and a human-playable game on one MuJoCo core."
requires-python = ">=3.11"
dependencies = [
    "mujoco==3.16.0",
    "gymnasium>=1.4,<2",
    "numpy",
    "pyyaml>=6.0.3",
    "click>=8.1",
]

[project.optional-dependencies]
# Minari 0.5's DataCollector imports jax, which only its `create` extra installs.
data = ["minari[arrow,create]==0.5.*", "pillow>=13.0.0"]
game = ["imgui-bundle", "glfw"]
all = ["hamsterball[data,game]"]

[project.scripts]
hamsterball-play = "hamsterball.game.window:main"
hamsterball-bench = "hamsterball.bench:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
