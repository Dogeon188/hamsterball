# The first_goal platform with a 0.4 m round hill (hill.png) between the spawn and the goal.
version: 1
kill_plane_z: -5
geoms:
  - {type: box, pos: [0, 0, -0.5], size: [10, 10, 0.5]}
  - {type: hfield, pos: [0, 4, 0], size: [2.5, 2.5, 0.4], file: hill.png}
tasks:
  reach_goal:
    spawn: {pos: [0, 0, 0.5], yaw_deg: 0}
    goal: {type: sphere, pos: [0, 8, 0.5], radius: 1}
    time_limit_s: 30
