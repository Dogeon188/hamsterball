# A 30 m square platform with the goal straight ahead and two keys off to the sides; the goal opens once both are in.
version: 1
kill_plane_z: -5
geoms:
  - {type: box, pos: [0, 0, -0.5], size: [15, 15, 0.5]}
tasks:
  unlock_goal:
    spawn: {pos: [0, 0, 0.5], yaw_deg: 0}
    keys:
      - {type: sphere, pos: [7, 2, 0.5], radius: 0.8}
      - {type: sphere, pos: [-7, 2, 0.5], radius: 0.8}
    goal: {type: sphere, pos: [0, 9, 0.5], radius: 1}
    time_limit_s: 45
