# Stay inside a 3.5 m sphere region for 20 s while two short bars sweep across it, one along x and one along y,
# shoving the hamsterball. Each bar is 3 m long, so stepping aside dodges it.
version: 1
kill_plane_z: -5
geoms:
  - {type: box, pos: [0, 0, -0.5], size: [8, 8, 0.5]}
bodies:
  - pos: [0, 0, 0.4]
    geoms: [{type: box, size: [0.25, 1.5, 0.4], rgba: [0.85, 0.45, 0.1, 1]}]
    motion: {type: oscillate, axis: [1, 0, 0], amplitude: 5, period: 6, phase: 0.25}
  - pos: [0, 0, 0.4]
    geoms: [{type: box, size: [1.5, 0.25, 0.4], rgba: [0.85, 0.45, 0.1, 1]}]
    motion: {type: oscillate, axis: [0, 1, 0], amplitude: 5, period: 9, phase: 0.75}
tasks:
  survive:
    spawn: {pos: [0, 0, 0.5], yaw_deg: 0}
    region: {type: sphere, pos: [0, 0, 0.5], radius: 3.5}
    time_limit_s: 20
